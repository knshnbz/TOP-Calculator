<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="header"></div>
        <div class="calculator">
            <div class="screen">
                <div class="features">
                    <div class="mode">
                        <!-- <label class="switch">
                            <input type="checkbox">
                            <span class="slider"></span>
                        </label> -->
                    </div>
                    <!-- <div class="history">
                        <button class="history">Hi</button>
                    </div> -->
                </div>
                <div class="historyTemp"></div>
                <div class="sum"><div class="text-container">0</div></div>
            </div>
            <div class="calc-bottom">
                <div class="row">
                    <button class="back" data-key="Backspace">⌫</button>
                    <button class="clear" data-key="Escape">AC</button>
                    <button class="operation" data-key="%">%</button>
                    <button class="operation" data-key="/">/</button>
                </div>
                <div class="row">
                    <button class="num" id="7" data-key="7">7</button>
                    <button class="num" id="8" data-key="8">8</button>
                    <button class="num" id="9" data-key="9">9</button>
                    <button class="operation" data-key="*">*</button>
                </div>
                <div class="row">
                    <button class="num" id="4" data-key="4">4</button>
                    <button class="num" id="5" data-key="5">5</button>
                    <button class="num" id="6" data-key="6">6</button>
                    <button class="operation" data-key="-">-</button>
                </div>
                <div class="row">
                    <button class="num" id="1" data-key="1">1</button>
                    <button class="num" id="2" data-key="2">2</button>
                    <button class="num" id="3" data-key="3">3</button>
                    <button class="operation" data-key="+">+</button>
                </div>
                <div class="row">
                    <button class="changer" data-key="negate">+/-</button>
                    <button class="num" id="zero" data-key="0">0</button>
                    <button class="num" id="decimal" data-key=".">.</button>
                    <button class="enter" data-key="=">=</button>
                </div>
            </div>
        </div>
        <div class="" id="cleanWave"></div>
        <div class="footer">
            <p>
                &copy; <span id="year"></span> Kaan ·
                <img src="github.ico" alt="GitHub">
                <a href="https://github.com/knshnbz/TOP-Calculator" target="_blank" rel="noopener noreferrer">
                    GitHub
                </a>
                
            </p>
        </div>
    </div>


    <script src="script.js" defer></script>
</body>
</html>
